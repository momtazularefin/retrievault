name: CI

on:
  push:
    branches: ["main"]
  pull_request:
    branches: ["main"]

jobs:
  backend:
    runs-on: ubuntu-latest
    services:
      # Integration tests run against a real Qdrant instead of skipping.
      qdrant:
        image: qdrant/qdrant:v1.18.2
        ports:
          - 6333:6333
    env:
      QDRANT_URL: http://localhost:6333
    steps:
      - uses: actions/checkout@v7

      - uses: astral-sh/setup-uv@v10
        with:
          version: "0.11.23"
          enable-cache: true
          cache-dependency-glob: backend/uv.lock

      # --frozen installs exactly what uv.lock pins. Installing unpinned (pip install -e .)
      # let a new ruff release change the default rule set and fail every build.
      - name: Install dependencies
        working-directory: backend
        run: uv sync --frozen --all-extras

      - name: Lint
        working-directory: backend
        run: uv run ruff check .

      - name: Test
        working-directory: backend
        run: uv run pytest

  frontend:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-node@v7
        with:
          # Matches the version in docs/getting-started.md.
          node-version: "24"
          cache: npm
          cache-dependency-path: frontend/package-lock.json

      - name: Install dependencies
        working-directory: frontend
        run: npm ci

      - name: Lint
        working-directory: frontend
        run: npm run lint

      - name: Build
        working-directory: frontend
        run: npm run build
