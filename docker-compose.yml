services:
  qdrant:
    # Pinned: an unpinned tag changes the search engine under a published benchmark.
    image: qdrant/qdrant:v1.18.2
    ports:
      - "6333:6333"
    volumes:
      - qdrant_data:/qdrant/storage
    healthcheck:
      test: ["CMD-SHELL", "bash -c ':> /dev/tcp/127.0.0.1/6333' || exit 1"]
      interval: 5s
      timeout: 3s
      retries: 20

  backend:
    build: ./backend
    ports:
      - "8000:8000"
    env_file:
      - .env
    environment:
      - QDRANT_URL=http://qdrant:6333
      # The local Qdrant has no API key; an empty value also silences the client's
      # "insecure connection" warning.
      - QDRANT_API_KEY=
      - CORS_ORIGINS=http://localhost:3000
    volumes:
      # The ONNX models are downloaded on first use; keep them across container restarts.
      - model_cache:/models
    depends_on:
      qdrant:
        condition: service_healthy

volumes:
  qdrant_data:
  model_cache:
